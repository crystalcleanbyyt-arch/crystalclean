<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You | Crystal Clean by YT</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f6f1eb;
      --bg-2: #efe7de;
      --surface: rgba(255,255,255,0.86);
      --text: #2f2a26;
      --muted: #6d645d;
      --accent: #b78966;
      --shadow: 0 18px 60px rgba(73, 52, 33, 0.10);
      --max: 1200px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 15%, rgba(232, 209, 187, 0.75), transparent 26%),
        radial-gradient(circle at 85% 20%, rgba(213, 191, 173, 0.55), transparent 25%),
        radial-gradient(circle at 20% 85%, rgba(244, 226, 213, 0.8), transparent 30%),
        linear-gradient(180deg, var(--bg) 0%, #fbf8f5 45%, var(--bg-2) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .wrap {
      width: 100%;
      max-width: 760px;
    }

    .card {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.55);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      border-radius: 32px;
      padding: 42px 34px;
      text-align: center;
    }

    .eyebrow {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.7);
      border: 1px solid rgba(95,77,61,0.08);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #6a5d54;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 16px;
      font-family: 'Cormorant Garamond', serif;
      font-weight: 500;
      font-size: clamp(42px, 6vw, 64px);
      line-height: 0.98;
      color: #221d19;
    }

    p {
      margin: 0 auto 14px;
      max-width: 560px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.8;
    }

    .actions {
      margin-top: 28px;
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 22px;
      border-radius: 999px;
      border: 1px solid transparent;
      font-weight: 600;
      text-decoration: none;
      transition: 0.25s ease;
      white-space: nowrap;
    }

    .btn-primary {
      background: linear-gradient(180deg, #be9371 0%, #ab7e59 100%);
      color: #fff;
      box-shadow: 0 12px 28px rgba(171, 126, 89, 0.28);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 36px rgba(171, 126, 89, 0.34);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.62);
      border-color: rgba(95,77,61,0.10);
      color: var(--text);
    }

    .note {
      margin-top: 18px;
      font-size: 14px;
      color: #7a7068;
    }

    @media (max-width: 640px) {
      .card {
        padding: 32px 22px;
        border-radius: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="eyebrow">Crystal Clean by YT</div>
      <h1>Thank you for your request.</h1>
      <p>
        Your message has been sent successfully. We will review the details and get back to you as soon as possible.
      </p>
      <p>
        We appreciate your interest in Crystal Clean by YT.
      </p>

      <div class="actions">
        <a class="btn btn-primary" href="./index.html">Back to site</a>
        <a class="btn btn-secondary" href="mailto:crystalcleanbyyt@gmail.com">Email us</a>
      </div>

      <div class="note">
        Twin Cities &amp; Suburbs, Minnesota
      </div>
    </div>
  </div>
</body>
</html>
